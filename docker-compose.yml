# Docker Compose de la concesionaria.
#
# Buenas prácticas aplicadas (guía de seguridad Docker 2026):
#   - Sin clave `version:` (obsoleta en el spec actual de Compose).
#   - Imágenes con versión fija (sin :latest) para builds reproducibles.
#   - Secretos obligatorios (BD_PASSWORD, JWT_SECRETO): fallan rápido si faltan
#     (fail-fast con `${VAR:?...}`) en lugar de defaults inseguros.
#   - Redes segmentadas: `red-publica` (frontend + backend) y `red-interna`
#     (backend + postgres). Postgres no queda en la red pública.
#   - Puertos publicados solo en loopback (127.0.0.1): no se exponen a la red.
#   - Contenedores no-root (`user:`), capabilities mínimas (`cap_drop: [ALL]`
#     + `cap_add` mínimo) y `security_opt: no-new-privileges`.
#   - Filesystem de solo lectura (`read_only: true`) con `tmpfs` para lo
#     escribible, donde la imagen lo permite.
#   - `init: true` (tini) para manejo correcto de señales y zombies.
#   - Healthchecks en todos los servicios, rotación de logs y límites de memoria.
#
# Para generar los secretos en PowerShell:
#   $env:BD_PASSWORD = -join ((1..24) | ForEach-Object { (48..122 | Get-Random -Count 1) } | ForEach-Object { [char]$_ })
#   $env:JWT_SECRETO  = -join ((1..32) | ForEach-Object { (48..122 | Get-Random -Count 1) } | ForEach-Object { [char]$_ })

name: concesionaria

services:
  postgres:
    image: postgres:17-alpine
    container_name: concesionaria-postgres
    restart: unless-stopped
    user: "70:70"
    environment:
      POSTGRES_USER: ${BD_USUARIO:-concesionaria}
      POSTGRES_PASSWORD: ${BD_PASSWORD:?Definí BD_PASSWORD en .env}
      POSTGRES_DB: ${BD_NOMBRE:-concesionaria}
    # Solo accesible desde el host (loopback) para tareas de mantenimiento.
    # Eliminá esta línea si no necesitás psql desde el host: el backend se
    # conecta por la red interna.
    ports:
      - "127.0.0.1:${BD_PUERTO:-5432}:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    networks:
      - red-interna
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BD_USUARIO:-concesionaria} -d ${BD_NOMBRE:-concesionaria}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    container_name: concesionaria-backend
    restart: unless-stopped
    init: true
    user: "10001:10001"
    stop_grace_period: 10s
    environment:
      HOST_API: 0.0.0.0
      PUERTO_API: ${PUERTO_API:-8080}
      BD_HOST: postgres
      BD_PUERTO: 5432
      BD_USUARIO: ${BD_USUARIO:-concesionaria}
      BD_PASSWORD: ${BD_PASSWORD:?Definí BD_PASSWORD en .env}
      BD_NOMBRE: ${BD_NOMBRE:-concesionaria}
      BD_SSL: disable
      JWT_SECRETO: ${JWT_SECRETO:?Definí JWT_SECRETO en .env}
      # Clave para cifrar el contenido de las cotizaciones en reposo. Vacía =
      # el backend usa JWT_SECRETO como respaldo.
      CLAVE_ENCRIPTACION: ${CLAVE_ENCRIPTACION:-}
      CORS_ORIGENES: ${CORS_ORIGENES:-*}
      # LLM: Gemini en la nube (googleai) con GOOGLE_API_KEY.
      PROVEEDOR_LLM: ${PROVEEDOR_LLM:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Modelos vacíos = el backend elige el default (gemini-3.5-flash-lite).
      MODELO_CHATBOT: ${MODELO_CHATBOT:-}
      MODELO_VISION: ${MODELO_VISION:-}
      ARGAUTOS_URL: ${ARGAUTOS_URL:-https://argautos.com/api/v1}
      # "Continuar con Google" (CU-11): vacío = flujo deshabilitado (el backend
      # responde 503 y el frontend oculta el botón).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Seña de reserva (CU-08): datos bancarios mostrados al cliente. Vacíos =
      # la UI indica que el personal pasará los datos.
      CBU_CONCESIONARIA: ${CBU_CONCESIONARIA:-}
      ALIAS_CONCESIONARIA: ${ALIAS_CONCESIONARIA:-}
    ports:
      - "127.0.0.1:${PUERTO_API:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red-publica
      - red-interna
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: concesionaria-frontend
    restart: unless-stopped
    init: true
    user: "101:101"
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:${PUERTO_FRONTEND:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - red-publica
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Necesaria para escuchar en el puerto 80 (< 1024).
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  datos-postgres:

networks:
  red-publica:
  red-interna:
