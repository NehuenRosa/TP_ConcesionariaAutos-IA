# Configuración principal de nginx.
# Optimizada para correr como usuario no-root con filesystem de solo lectura
# (ver docker-compose.yml): logs a stdout/stderr y rutas temporales en /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Directorios temporales en tmpfs (/tmp) para compatibilidad con read_only
    # (nginx solo crea un nivel de directorio, por eso sin subcarpetas).
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # SPA: reenviar todas las rutas al index
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cachear assets estáticos
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
