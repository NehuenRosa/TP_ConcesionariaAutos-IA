# Blueprint de despliegue en Render (cloud).
#
# Antes de usar, reemplazar los placeholders TU-FRONTEND, TU-BACKEND y cargar
# GOOGLE_API_KEY en el panel (ver docs/despliegue-nube.md). El plan free
# duerme los servicios web tras 15 min de inactividad y el Postgres free
# expira a los 90 días.

databases:
  - name: concesionaria-postgres
    databaseName: concesionaria
    user: concesionaria
    plan: free
    region: oregon

services:
  - type: web
    name: concesionaria-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: BD_URL
        fromDatabase:
          name: concesionaria-postgres
          property: connectionString
      - key: JWT_SECRETO
        generateValue: true
      - key: CORS_ORIGENES
        value: https://TU-FRONTEND.onrender.com
      # LLM en la nube: Google AI Gemini (gratis, texto + visión). La clave se
      # crea en https://aistudio.google.com y se pega en el panel de Render
      # (no en el blueprint, para no exponerla en el repo).
      - key: PROVEEDOR_LLM
        value: googleai
      - key: GOOGLE_API_KEY
        value: TU-GOOGLE-API-KEY
        sync: false

  - type: web
    name: concesionaria-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    # Render inyecta esta variable como build arg: la usa Vite en el build.
    envVars:
      - key: VITE_API_URL
        value: https://TU-BACKEND.onrender.com/api
