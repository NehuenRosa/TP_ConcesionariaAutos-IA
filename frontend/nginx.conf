server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: reenviar todas las rutas al index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachear assets estáticos
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
